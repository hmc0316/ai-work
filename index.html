<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工作紀錄</title>
<style>
  body { margin: 0; background: #f5f6f1; color: #202820; font: 1rem/1.6 system-ui, sans-serif; }
  main { max-width: 38rem; margin: 3rem auto; padding: 0 1.25rem; }
  form, li { background: white; border: 1px solid #d6ded4; border-radius: .75rem; padding: 1rem; }
  label, textarea { display: block; margin-bottom: .5rem; }
  textarea { width: 100%; box-sizing: border-box; padding: .6rem; font: inherit; }
  button { background: #23543b; color: white; border: 0; border-radius: .4rem; padding: .55rem 1rem; font: inherit; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: .5rem; }
  .entry-text { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .delete-entry { background: white; color: #8a3025; border: 1px solid #cfa8a0; }
</style>
</head>
<body>
<main>
  <h1>AI 工作紀錄</h1>
  <p>紀錄會儲存在這個瀏覽器。</p>
  <form>
    <label for="entry">我請 AI 做了什麼？</label>
    <textarea id="entry" rows="4" required></textarea>
    <button>新增紀錄</button>
  </form>
  <p id="status" role="status"></p>
  <h2>紀錄</h2>
  <p id="empty">還沒有紀錄。</p>
  <ul id="entries"></ul>
</main>
<script>
  const storageKey = 'ai-work-log.entries';
  const form = document.querySelector('form');
  const input = document.querySelector('#entry');
  const status = document.querySelector('#status');
  const list = document.querySelector('#entries');
  const empty = document.querySelector('#empty');
  const submit = form.querySelector('button');

  function readEntries() {
    const entries = JSON.parse(localStorage.getItem(storageKey) ?? '[]');
    if (!Array.isArray(entries) || entries.some(entry => typeof entry !== 'string')) {
      throw new Error('Invalid entries');
    }
    return entries;
  }

  function render(entries) {
    list.replaceChildren(...entries.map((entry, index) => {
      const item = document.createElement('li');
      const text = document.createElement('span');
      text.className = 'entry-text';
      text.textContent = entry;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete-entry';
      remove.textContent = '刪除';
      remove.setAttribute('aria-label', `刪除第 ${index + 1} 筆紀錄`);
      remove.addEventListener('click', () => deleteEntry(entries, index));
      item.append(text, remove);
      return item;
    }));
    empty.hidden = entries.length > 0;
  }

  function deleteEntry(displayedEntries, index) {
    try {
      const entries = readEntries();
      if (entries.length !== displayedEntries.length ||
          entries.some((entry, position) => entry !== displayedEntries[position])) {
        render(entries);
        status.textContent = '紀錄已在另一個分頁更新。請確認後再刪除。';
        input.focus();
        return;
      }

      entries.splice(index, 1);
      localStorage.setItem(storageKey, JSON.stringify(entries));
      render(entries);
    } catch {
      status.textContent = '刪除失敗。請確認瀏覽器允許網站儲存資料，再試一次。';
      return;
    }

    status.textContent = '已刪除紀錄。';
    (list.children[index]?.querySelector('button') ??
      list.lastElementChild?.querySelector('button') ?? input).focus();
  }

  try {
    render(readEntries());
  } catch {
    empty.hidden = true;
    submit.disabled = true;
    status.textContent = '讀取紀錄失敗。請確認瀏覽器允許網站儲存資料，再重新整理。';
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    const entry = input.value.trim();
    if (!entry) {
      status.textContent = '請輸入紀錄內容。';
      input.focus();
      return;
    }

    try {
      const entries = [entry, ...readEntries()];
      localStorage.setItem(storageKey, JSON.stringify(entries));
      render(entries);
    } catch {
      status.textContent = '儲存失敗。你可以保留輸入內容，再檢查瀏覽器的儲存設定。';
      return;
    }

    form.reset();
    status.textContent = '已新增紀錄。';
    input.focus();
  });
</script>
</body>
</html>
